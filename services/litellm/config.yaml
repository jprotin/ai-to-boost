# LiteLLM — gateway des modèles LOCAUX (Phase 1)
# Architecture : docs/adr/0001 (socle) + docs/adr/0002 (LiteLLM = local only)
#               + docs/adr/0007 (Ollama dockerisé, remplace LM Studio)
# Endpoint unique OpenAI-compatible : http://127.0.0.1:4000
#
# LiteLLM ne route QUE vers les modèles locaux (Ollama, service compose).
# Claude n'est PAS routé ici :
#   - Claude à la main (BMAD)  -> Claude Code (forfait Max)
#   - Claude automatisé (n8n)  -> `claude -p` headless / Agent SDK (forfait)
# Une route Claude au token (clé API console) pourra être ajoutée plus tard
# UNIQUEMENT pour une tâche programmatique lourde — cf. ADR 0002.
---
model_list:
  # --- Ollama local (OpenAI-compatible /v1, service compose `ollama`) ---
  # Contrainte 12 Go VRAM : gemma (8.3 Go) + embed (0.6 Go) tiennent ensemble ;
  # qwen3:8b (~6 Go) tient seul full-GPU. OLLAMA_KEEP_ALIVE gère le load/unload.
  - model_name: local-gemma
    litellm_params:
      model: openai/gemma3n:e4b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama # pragma: allowlist secret (placeholder, Ollama n'exige pas de clé)
  - model_name: local-qwen
    litellm_params:
      model: openai/qwen3:8b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama # pragma: allowlist secret
  - model_name: local-embed
    litellm_params:
      model: openai/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama # pragma: allowlist secret

litellm_settings:
  drop_params: true # ignore les params non supportés par le backend local

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
